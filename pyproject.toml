[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "extract-pdf-bot"
version = "0.1.1"
package-mode = false
description = "TG bot that reads links from chat and downloads PDFs"
readme = "README.md"
authors = [
  "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
]
maintainers = [
    "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
]
repository = "https://github.com/SermanVS/extract-pdf-bot"

[tool.poetry.dependencies]
python = "^3.9"
tqdm = "4.67.1"
pathlib = "^1.0.1"
aiogram = "^3.0.0"
aiohttp = "^3.12.15"
beautifulsoup4 = "^4.13.5"
requests = "^2.32.5"
selenium = "^4.35.0"
selenium-stealth = "^1.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ipykernel = "^6.30.1"
