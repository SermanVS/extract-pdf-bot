[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "extract-pdf-bot"
version = "0.1.1"
package-mode = false
description = "TG bot that reads links from chat and downloads PDFs"
readme = "README.md"
authors = [
  "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
]
maintainers = [
    "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
]
repository = "https://github.com/SermanVS/extract-pdf-bot"

[tool.poetry.dependencies]
python = "^3.9"
tqdm = "4.67.1"
pathlib = "^1.0.1"
aiogram = "3.0.0"
requests = "2.29.0"
aiohttp = "3.8.5"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
